# What makes an agenda item interesting. Read by the routine (ROUTINE.md) and lacomm.

# Points an item gets for each matching topic. land_use is on nearly every
# planning item, so it counts for little on its own.
topics:
  parks: 3
  transportation: 3
  land_use: 1

# Neighborhood names as they appear in geo/neighborhoods.geojson
# (LA Times "Mapping L.A." boundaries via LA GeoHub, CC BY 4.0).
neighborhoods:
  - Silver Lake
  - East Hollywood
  - Los Feliz
  - Echo Park
  - Downtown
  - Chinatown
  - Historic Filipinotown  # not in the LA Times dataset; covered by Echo Park/Westlake + nearby_km
  - Hollywood
  - Koreatown
  - Westlake
  - Atwater Village
  - Glassell Park
  - Mount Washington
  - Cypress Park
  - Highland Park
  - Pico-Union
  - Griffith Park  # includes the LA Zoo
  - Elysian Valley  # Frogtown
  - Elysian Park  # includes Dodger Stadium; Elysian Heights is inside Echo Park
  - Eagle Rock
  - Hollywood Hills
  - Larchmont

# Points for location: inside a listed neighborhood, or within nearby_km of one.
in_neighborhood: 4
nearby: 2
nearby_km: 1.0
