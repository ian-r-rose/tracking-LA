name: Diagnose Rec & Parks

# Temporary: what Rec & Parks' firewall refuses from a GitHub runner. Results are
# annotations, which the public API shows without a token.

on:
  push:
    branches: [main]
    paths: [.github/workflows/rap-diagnose.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Probe
        shell: bash
        run: |
          UA="Mozilla/5.0 (compatible; tracking-la/0.1; +https://github.com/ian-r-rose/tracking-LA)"
          S=https://recreation.parks.lacity.gov
          IP=$(curl -s https://checkip.amazonaws.com)
          out=""
          probe() {  # label, then curl arguments
            local label=$1; shift
            local r
            r=$(curl -s -o /dev/null -w '%{http_code} %{http_version}' --max-time 20 "$@")
            out+="$label=$r; "
          }
          probe year "$S/commissioners/agendas-minutes-reports/2026" -A "$UA"
          probe year-accept "$S/commissioners/agendas-minutes-reports/2026" -A "$UA" -H "Accept: text/html,application/xhtml+xml" -H "Accept-Language: en-US,en;q=0.9"
          probe year-http1 "$S/commissioners/agendas-minutes-reports/2026" -A "$UA" --http1.1
          probe home "$S/" -A "$UA"
          probe robots "$S/robots.txt" -A "$UA"
          probe sitemap "$S/sitemap.xml" -A "$UA"
          probe jsonapi "$S/jsonapi" -A "$UA"
          probe pdf "$S/sites/default/files/pdf/commissioner/2026/oct01/26-218.pdf" -A "$UA"
          probe minutes "$S/sites/default/files/pdf/commissioner/2026/sep17/091726-min-telephonic-regular.pdf" -A "$UA"
          probe ip1 "$S/commissioners/agendas-minutes-reports/2026" -A "$UA" --resolve recreation.parks.lacity.gov:443:52.53.92.162
          probe ip2 "$S/commissioners/agendas-minutes-reports/2026" -A "$UA" --resolve recreation.parks.lacity.gov:443:13.56.177.238
          probe laparks "https://www.laparks.org/" -A "$UA"
          echo "::notice title=curl from $IP::$out"
          httpx=$(uv run python -c "
          import httpx
          from tracking_la import http_client
          with http_client(timeout=20) as c:
              for u in ['$S/commissioners/agendas-minutes-reports/2026', '$S/sites/default/files/pdf/commissioner/2026/oct01/26-218.pdf', '$S/jsonapi']:
                  r = c.get(u)
                  print(u.rsplit('/', 1)[-1], r.status_code, r.headers.get('server'), end='; ')
          ")
          echo "::notice title=httpx (fetcher's client)::$httpx"
          body=$(curl -s --max-time 20 -A "$UA" "$S/commissioners/agendas-minutes-reports/2026" | head -c 600 | tr '\n' ' ')
          echo "::notice title=403 body::$body"
