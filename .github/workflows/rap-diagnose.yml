name: Diagnose Rec & Parks

# Temporary: what Rec & Parks' firewall refuses from a GitHub runner. Results are
# annotations, which the public API shows without a token.

on:
  push:
    branches: [main]
    paths: [.github/workflows/rap-diagnose.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: sudo apt-get update -q && sudo apt-get install -y poppler-utils
      # The real fetch, from a fresh runner (nothing is committed).
      - name: Fetch Rec & Parks
        shell: bash
        run: |
          start=$(date +%s)
          uv run tracking-la fetch --since 30 --source "rec and parks" --refetch 2>&1 | tee fetch.log || true
          lines=$(grep -h "failed:\|fallback:\|waited:\|new:\|unchanged:" fetch.log | tr '\n' ' ')
          echo "::notice title=fetch ($(( $(date +%s) - start ))s)::$lines"
          git status --short data | head -50 | tr '\n' ' ' | sed 's/^/::notice title=changes::/'; echo
