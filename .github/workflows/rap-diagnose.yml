name: Diagnose Rec & Parks

# Temporary: what Rec & Parks' firewall refuses from a GitHub runner. Results are
# annotations, which the public API shows without a token.

on:
  push:
    branches: [main]
    paths: [.github/workflows/rap-diagnose.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Probe
        shell: bash
        run: |
          UA="Mozilla/5.0 (compatible; tracking-la/0.1; +https://github.com/ian-r-rose/tracking-LA)"
          S=https://recreation.parks.lacity.gov
          IP=$(curl -s https://checkip.amazonaws.com)
          # The year page every 10 seconds for four minutes: status, ELB address, seconds since start.
          t0=$(date +%s); out=""
          for i in $(seq 24); do
            r=$(curl -s -o body.html -w '%{http_code}@%{remote_ip}' --max-time 20 -A "$UA" "$S/commissioners/agendas-minutes-reports/2026" || echo err)
            out+="$(( $(date +%s) - t0 ))s:$r "
            [ "${r%%@*}" = 403 ] && cp body.html refused.html
            sleep 10
          done
          echo "::notice title=year page from $IP::$out"
          [ -f refused.html ] && echo "::notice title=403 body::$(head -c 800 refused.html | tr '\n\r' '  ')"
          true
